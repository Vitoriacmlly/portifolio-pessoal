	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Projeto Portfólio">
		<meta name="author" content="Generation Brasil">
		<meta name="keywords" content="HTML, CSS, JavaScript">
		<title>Meu Perfil</title>
	</head>
	<body>
		<header>
			<div id="header_content">
				<div id="titulo">
					<h1>Vitoria Camilly</h1>
                </div>
				<div id="menu">
					<nav>
						<ul id="menu">
							<li>
								<a href="index.html"> Home </a>
							</li>
							<li>
								<a href="contato.html"> Contato </a>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</header>
		<main>
             <section id="contact">
                <form action="#" method="submit" id="formulario">
                    <label for="nome">Nome: </label>
					<input
						id="name"
						type="text"
						name="name"
						placeholder="Digite seu nome"
						required
					/>
					<span id="txtNome"></span>

					<label for="email">Email: </label>
					<input
						id="email"
						type="email"
						name="email"
						placeholder="Digite seu email"
						required
					/>
					<span id="txtEmail"></span>

					<label for="subject">Assunto: </label>
					<input
						id="subject"
						type="text"
						name="subject"
						placeholder="Digite o título da mensagem"
						required
					/>
					<span id="txtSubject"></span>

					<label for="message">Mensagem: </label>
					<textarea
						id="message"
						name="message"
						placeholder="Digite sua mensagem"
						required
					>
					</textarea>
					<button type="submit">Enviar</button>
                </form>
                <article id="mapa">
                    <p> Parque Villa Lobos, Sao Paulo - SP</p>
                    <p> Sempre que posso estou por la passeando.</p>
                    <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14630.464160172403!2d-46.73565409875509!3d-23.54630846237009!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce56fa971a5e7d%3A0x6f6b8e0ec9daadd1!2sParque%20Villa-Lobos!5e0!3m2!1spt-BR!2sbr!4v1747848033972!5m2!1spt-BR!2sbr" 
                    width="600" 
                    height="450" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                </article>
            </section>
		</main>
		<footer>
            <section id="redes_sociais">
                <a href="www.linkedin.com/in/vitoria-camilly">
